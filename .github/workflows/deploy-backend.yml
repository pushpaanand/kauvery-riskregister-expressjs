- uses: actions/checkout@v4
- uses: actions/setup-node@v4
  with:
    node-version: '18'
- run: npm ci
  working-directory: backend
- run: npm run build
  working-directory: backend
- uses: azure/webapps-deploy@v2
  with:
    app-name: riskmanagement
    publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
    package: backend